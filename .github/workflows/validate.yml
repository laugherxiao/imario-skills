name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Agent Skills spec (skills-ref)
        run: npx -y skills-ref validate skills/imario

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Eval scenarios are well formed
        run: python evals/check_evals.py

      - name: Claude Code plugin manifest
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate . --strict

      - name: Cursor plugin manifest
        # Cursor's validator reads a marketplace at the repository root, so
        # check this plugin from inside a one-plugin wrapper.
        run: |
          mkdir -p /tmp/cursor/.cursor-plugin /tmp/cursor/plugins/imario
          tar --exclude=.git -cf - . | tar -xf - -C /tmp/cursor/plugins/imario
          echo '{"name":"imario-check","owner":{"name":"iMario"},"plugins":[{"name":"imario","source":"./plugins/imario"}]}' \
            > /tmp/cursor/.cursor-plugin/marketplace.json
          curl -fsSL https://raw.githubusercontent.com/cursor/plugin-template/main/scripts/validate-template.mjs \
            -o /tmp/validate-cursor.mjs
          cd /tmp/cursor && node /tmp/validate-cursor.mjs
